# 此工作流使用 Maven 构建 Java 项目，并缓存/恢复依赖项以提高工作流执行效率
# 更多信息请参见：https://docs.github.com/zh/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Maven Java 构建

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 使用 Maven 构建
      run: mvn -B package --file pom.xml

    # 上传构建产物（JAR 文件）到 GitHub Actions
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: 插件构建包
        path: target/*.jar
